<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fubon Daily Report</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  color-scheme: light;
  --paper:#F2F4F6; --surface:#FFFFFF; --sunk:#E8ECF0; --line:#D6DCE3; --ink:#15233A; --mute:#5B6878;
  --accent:#1D5AA6; --accent-soft:#E3ECF7; --warn:#A8670E; --warn-soft:#FBF0DD; --ok:#2C7255; --ok-soft:#E1F1EA; --bad:#B23A3A;
  --lt:#23767A; --ht:#5547C2; --xp:#9A6528;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --paper:#10161F; --surface:#18212C; --sunk:#202B38; --line:#2E3A48; --ink:#E4E9EF; --mute:#93A0AF;
  --accent:#6FA4E6; --accent-soft:#1E3047; --warn:#E3A84E; --warn-soft:#3A2C16; --ok:#6CC39C; --ok-soft:#183128; --bad:#E77B7B;
  --lt:#5CC0C4; --ht:#9C92F0; --xp:#D7A262; }}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#10161F; --surface:#18212C; --sunk:#202B38; --line:#2E3A48; --ink:#E4E9EF; --mute:#93A0AF;
  --accent:#6FA4E6; --accent-soft:#1E3047; --warn:#E3A84E; --warn-soft:#3A2C16; --ok:#6CC39C; --ok-soft:#183128; --bad:#E77B7B;
  --lt:#5CC0C4; --ht:#9C92F0; --xp:#D7A262; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "IBM Plex Sans","Noto Sans TC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:.01em}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.date{font-size:28px;font-weight:500;color:var(--accent)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:820px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{position:relative;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;min-height:76px}
.slot:hover,.slot.drag{border-color:var(--accent)}
.slot.done{border-style:solid;border-left:4px solid var(--ok)}
.slot b{display:block;font-weight:600}
.slot .fn{display:block;color:var(--mute);font-size:12.5px;word-break:break-all}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.slot .opt{font-size:11.5px;color:var(--mute);font-weight:400;margin-left:4px}
.bar{display:flex;gap:10px;align-items:center;margin:14px 0 22px;flex-wrap:wrap}
button,.btn{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:6px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] button.primary{color:#0E1620}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#0E1620}}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{color:var(--mute);font-size:13px}
.msg.err{color:var(--bad)}
.ledger{display:grid;grid-template-columns:1.1fr 1.6fr 1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px}
@media (max-width:820px){.ledger{grid-template-columns:1fr 1fr}}
.cell{padding:14px 18px;border-right:1px solid var(--line)}
.cell:last-child{border-right:0}
.cell .k{color:var(--mute);font-size:12.5px}
.cell .v{font-size:22px;font-weight:500;margin-top:2px}
.cell .v small{font-size:13px;color:var(--mute);font-weight:400}
.strike{color:var(--mute);text-decoration:line-through;font-size:14px;margin-right:6px}
.cell.alert{background:var(--warn-soft)}
.cell.alert .v{color:var(--warn)}
.cell.clear{background:var(--ok-soft)} .cell.clear .v{color:var(--ok)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;border-bottom:2px solid transparent;border-radius:0;color:var(--mute);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--warn);color:var(--surface);font-size:11.5px;text-align:center}
.panel{display:none}.panel.on{display:block}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--sunk);font-weight:600;font-size:12.5px;color:var(--mute)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:600;background:var(--sunk)}
.ch{display:inline-block;font-size:11.5px;font-weight:600;padding:0 6px;border-radius:4px;margin-right:3px;border:1px solid currentColor}
.ch.LT{color:var(--lt)}.ch.HT{color:var(--ht)}.ch.XP{color:var(--xp)}.ch.NU{color:var(--mute)}
.bad{color:var(--bad);font-weight:600}
.pending{color:var(--warn);font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
select,input[type=text]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);max-width:220px}
.note{color:var(--mute);font-size:12.5px;margin:0 0 10px;max-width:75ch}
.uitem td{vertical-align:top}
.cands{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:200px}
.cand{white-space:nowrap;font-size:12px;padding:2px 8px;border-radius:12px;background:var(--accent-soft);color:var(--accent);border:0}
.done-row{background:var(--ok-soft)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
h3{font-size:14px;margin:0 0 8px;font-weight:600}

.rp-tools{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
#reportCard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 22px;max-width:980px;overflow-x:auto}
.rp-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.rp-head h2{margin:0;font-size:19px;font-weight:700}
.rp-head span{color:var(--mute);font-size:12.5px}
#reportCard table{margin-bottom:16px;font-size:13px}
#reportCard th{position:static}
table.fini th,table.kpi thead th,table.rk th,table.dma th{background:var(--ink);color:var(--surface)}
table.kpi td.lbl{background:var(--sunk);white-space:normal;width:170px}
table.kpi td.lbl b{display:block;font-weight:600}
table.kpi td.lbl span{color:var(--mute);font-size:12px}
table.kpi td.sub{color:var(--mute);font-size:12.5px}
table.kpi tr.g1 td{border-top:2px solid var(--line)}
table.kpi td.tgt{color:var(--mute)}
table.kpi td.act{font-weight:600}
table.kpi td.rr.up{color:var(--ok);font-weight:600}
table.kpi td.rr.down{color:var(--bad);font-weight:600}
table.kpi tr.net td{font-weight:600;background:var(--accent-soft)}
td.neg{color:var(--bad)}
.rk2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.rk2 table td,.rk2 table th{padding:6px 7px}
@media (max-width:820px){.rk2{grid-template-columns:1fr}}
table.dma{max-width:420px}
.foot{color:var(--mute);font-size:12px;margin:0}
#reportInputs{max-width:900px;margin-top:16px}
#reportInputs details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 16px;margin-bottom:10px}
#reportInputs summary{cursor:pointer;font-weight:600;padding:4px 0}
#reportInputs .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;margin:10px 0}
@media (max-width:700px){#reportInputs .grid{grid-template-columns:1fr}}
#reportInputs label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute)}
#reportInputs input.num,#reportInputs input[disabled]{max-width:none;width:100%;text-align:right;font-variant-numeric:tabular-nums}
.btab td{padding:4px 8px}

.ledger.rb{grid-template-columns:repeat(3,1fr)}
.rbd{margin:12px 0 22px}.rbd summary{cursor:pointer;font-weight:600;margin-bottom:8px}
.rb-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0 6px}
.rb-head h3{margin:0;margin-right:auto}
.gl{font-size:12.5px;color:var(--mute);display:flex;gap:6px;align-items:center}
.rule{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:10px;max-width:980px}
.rule.off{border-left-color:var(--line);opacity:.65}
.rule-top{display:flex;gap:10px;align-items:center}
.rule .rname{font-weight:600;font-size:14px;flex:1;max-width:280px}
.rbtns{margin-left:auto;display:flex;gap:4px}.rbtns button{padding:4px 9px}
.note-in{width:100%;max-width:none!important;margin:8px 0;color:var(--mute);font-size:12.5px!important}
.rgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 12px;margin:6px 0}
@media (max-width:820px){.rgrid{grid-template-columns:1fr 1fr}}
.rgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
.rgrid input,.rgrid select{max-width:none;width:100%}
label.chk{flex-direction:row!important;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
table.tiers{width:auto;margin:8px 0}table.tiers th{position:static;background:none;padding:4px 8px}table.tiers td{padding:4px 8px;border:0}
.t-add{font-size:12.5px;padding:4px 10px}
.rgrid label.chk{white-space:nowrap;align-self:end;justify-content:flex-start;padding-bottom:7px}

#marketBox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--paper)}
.mk-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:4px 0 10px}
table.mk td{vertical-align:top;white-space:normal}
table.mk td:first-child{min-width:220px}
table.mk textarea{display:block;width:100%;min-width:200px;margin-top:4px;font:12px/1.3 ui-monospace,monospace;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);padding:4px 6px;resize:vertical}
.mkerr{color:var(--bad);font-size:12px}
.okc{color:var(--ok);font-weight:600}
table.mk a{color:var(--accent);font-size:13px}
.mkcfg summary{cursor:pointer;font-size:13px;color:var(--mute)}
.mkurl{display:flex;flex-direction:column;font-size:12px;color:var(--mute);margin:6px 0}
.mkurl input{max-width:none!important;width:100%;font-size:12px!important}

.daybox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.daybox label{color:var(--mute);font-size:13px}
#daySel{font-size:18px;font-weight:500;color:var(--accent);padding:6px 10px;max-width:none}
.warn{background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.warn b{color:var(--warn)}

#brokerCard{margin-top:24px}
.brk-head{margin-top:4px}
.upbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 18px;max-width:980px;margin-top:18px}
.upbox h3{margin:0 0 8px}
:root{--c0:#FBEDE4;--c1:#ECE6F5;--c2:#E3F0F6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c0:#3A2A22;--c1:#2C2638;--c2:#1F3038}}
:root[data-theme="dark"]{--c0:#3A2A22;--c1:#2C2638;--c2:#1F3038}
table.brk{font-size:13px}
table.brk th{background:var(--ink);color:var(--surface);position:static}
table.brk td.c0{background:var(--c0)} table.brk td.c1{background:var(--c1)} table.brk td.c2{background:var(--c2)}
table.brk tr.self td{font-weight:700}
table.brk tr.sep td{border-top:2px solid var(--ink)}
#brkMapBox{margin-top:6px}
#brkMapBox details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 16px}
#brkMapBox summary{cursor:pointer;font-weight:600}

.tab.peta{margin-left:10px;border:1px solid var(--line)!important;border-radius:6px 6px 0 0;background:var(--sunk);color:var(--ink);font-weight:600;font-size:13px}
.tab.peta[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent)!important;border-bottom-color:var(--accent-soft)!important}
.subtabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:0 8px 8px 8px;padding:4px 6px;margin:-15px 0 14px}
.subtabs .tab{font-size:13px;padding:7px 12px}
.subtabs[hidden],[hidden]{display:none!important}

.syncbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px;font-size:13px}
.xfer{margin-left:auto;display:flex;gap:8px}
.syncbar button{padding:5px 12px;font-size:13px}
.linkbtn{border:0;background:none;color:var(--mute);text-decoration:underline;padding:0 4px;font-size:12px;cursor:pointer}
.exbox{max-width:none;margin-top:20px}
.exbox input{max-width:none}
.dcsel{font-size:12.5px;padding:3px 6px}

/* 只保留框內的說明文字 */
.note{display:none}
.upbox .note,#reportInputs .note,.rule .note,details .note,.rcard .note{display:block}
header .sub{display:none}
.mkimp{display:flex;gap:10px;align-items:center;margin:8px 0 4px;flex-wrap:wrap}
button.danger{color:var(--bad);border-color:var(--bad)}

.rk2.n2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.rk2.n3,.rk2.n4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.rk-title{text-align:center;font-weight:700;color:var(--accent);margin:4px 0 6px;font-size:13.5px}
.rk4 table{width:100%;table-layout:fixed}
.rk4 th:nth-child(1),.rk4 td:nth-child(1){width:72px}
.rk4 th:nth-child(3),.rk4 td:nth-child(3){width:96px}
.rk4 th:nth-child(4),.rk4 td:nth-child(4){width:98px}
.rk4 td:nth-child(2){white-space:normal;word-break:break-word}
.ovbox{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
.ovbox input{max-width:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Fubon Daily Report</h1><div class="sub">Trade Confirm 為準，回溯 DMA / FOMS / K Way 下單檔歸戶，並修正 0.1425% 預設手收</div></div>
  <div class="daybox"><label for="daySel">交易日</label><select id="daySel"></select><span id="saveStat"></span></div>
</header>
<div class="warn" id="saveWhy" hidden></div>


<div class="slots">
  <label class="slot" id="s-conf"><b>Trade Confirm</b><span class="fn">Trade_Conf_MMDD.xls</span><input type="file" accept=".xls,.xlsx" data-k="conf"></label>
  <label class="slot" id="s-lt"><b>DMA 下單檔</b><span class="fn">MMDD_LT.xlsx</span><input type="file" accept=".xls,.xlsx" data-k="lt"></label>
  <label class="slot" id="s-ht"><b>FOMS 下單檔</b><span class="fn">MMDD_HT.xlsx</span><input type="file" accept=".xls,.xlsx" data-k="ht"></label>
  <label class="slot" id="s-xp"><b>K Way<span class="opt">選填</span></b><span class="fn">xpats_MMDD.xls</span><input type="file" accept=".xls,.xlsx" data-k="xp"></label>
</div>
<div class="bar">
  <button class="primary" id="run" disabled>開始比對</button>
  <span class="msg" id="msg">先放入 Trade Confirm、DMA、FOMS 三個檔案。</span>
  <span class="xfer"><button id="ovExport">匯出業績總覽</button><button id="shareExport">匯出</button><label class="btn">匯入<input type="file" id="shareImport" accept=".json,.gz" hidden></label><input type="file" id="bkImportTop" accept=".json,.gz" hidden></span>
</div>

<div id="out" hidden>
  <div class="ledger" id="ledger"></div>
  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-p="report" aria-selected="true">報表</button>
    <button class="tab" role="tab" data-p="rank">本日排名</button>
    <button class="tab" role="tab" data-p="todo">待人工確認</button>
    <button class="tab peta" role="tab" data-p="peta" aria-expanded="false">peta ▾</button>
  </div>
  <div class="subtabs" id="subtabs" hidden>
    <button class="tab" role="tab" data-p="fix">手收修正</button>
    <button class="tab" role="tab" data-p="detail">全部明細</button>
    <button class="tab" role="tab" data-p="rebate">Rebate</button>
    <button class="tab" role="tab" data-p="month">本月排名</button>
    <button class="tab" role="tab" data-p="map">對照表</button>
    <button class="tab" role="tab" data-p="db">資料庫</button>
  </div>
  <section class="panel on" id="p-report"><div class="rp-tools"><button id="png">下載報表圖片</button><label class="chk"><input type="checkbox" id="showW"> 週排名</label><label class="chk"><input type="checkbox" id="showY"> 年排名</label></div><div id="reportCard"></div><div class="upbox"><h3>券商排名資料</h3><div class="rp-tools"><label class="btn">上傳券商排名 txt<input type="file" id="brkFile" accept=".txt" hidden></label><span class="msg" id="brkMsg"></span></div><div id="brkMapBox"></div></div><div id="reportInputs"></div></section>
  <section class="panel" id="p-rank"></section>
  <section class="panel" id="p-todo"></section>
  <section class="panel" id="p-fix"></section>
  <section class="panel" id="p-detail"></section>
  <section class="panel" id="p-rebate"></section>
  <section class="panel" id="p-month"></section>
  <section class="panel" id="p-map"></section>
  <section class="panel" id="p-db-wrap"><div class="syncbar"><button id="syncBtn">連結共用資料夾</button><span id="syncStat"></span></div><div id="p-db"></div></section>
  <div class="bar">
    <button id="export">匯出 Excel</button>
    <span class="msg" id="msg2"></span>
  </div>
</div>
</div>

<script>
// ===== Engine: parse Trade Conf / LT / HT / XPATS, map, fix commission =====
const RATE = { LT: 0.0005, HT: 0.0008, XP: 0.0003 };
const SRC_LABEL = { LT: 'DMA', HT: 'FOMS', XP: 'K Way', NU: 'NuOMS' };
const BAD_BPS = 14.25;

function num(v) { if (v === null || v === undefined || v === '') return 0; const n = Number(String(v).replace(/,/g, '')); return isFinite(n) ? n : 0; }
function symKey(v) { let s = String(v ?? '').trim(); s = s.split('-')[0].trim(); return s.replace(/^0+(?=.)/, ''); }
function sideKey(v) { const s = String(v ?? '').trim().toUpperCase(); if (s === '1') return 'B'; if (s === '2' || s === '5' || s === '6') return 'S'; return s.startsWith('B') ? 'B' : (s.startsWith('S') ? 'S' : s); }
function rowsOf(XLSX, ws) { return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null }); }

function parseConf(XLSX, wb) {
  const out = []; let tradeDate = null;
  wb.SheetNames.forEach(sn => {
    const r = rowsOf(XLSX, wb.Sheets[sn]);
    let fid = null, name = null, inBlock = false;
    for (let i = 0; i < r.length; i++) {
      const row = r[i] || []; const c0 = String(row[0] ?? '').trim();
      if (c0 === 'Trade Date' && !tradeDate) tradeDate = String(row[1] ?? '').trim();
      if (c0 === 'A/C' && String(row[1] ?? '').trim() === 'Code') { inBlock = true; continue; }
      if (c0 === 'A/C') { fid = row[1]; name = row[2]; inBlock = false; continue; }
      if (!inBlock) continue;
      if (c0.startsWith('Total')) { inBlock = false; continue; }
      if (!c0) continue;
      const sh = num(row[5]); if (!sh) continue;
      out.push({ id: out.length, sheet: sn, ac: c0, fid: String(fid ?? ''), name: String(name ?? '').trim(),
        code: String(row[1] ?? '').trim(), sym: symKey(row[1]), stock: String(row[2] ?? '').trim(),
        bs: sideKey(row[4]), sh, px: num(row[6]), gross: num(row[7]), comm: num(row[9]), totc: num(row[11]), bps: num(row[14]) });
    }
  });
  return { rows: out, tradeDate };
}

function parseLT(XLSX, wb) {
  // 支援兩種 DMA 匯出格式：舊版（CumQty、AllocAccount…）與新版 Main_Orders（全大寫欄位、FIXACCOUNT、SIDE 為 1/2）
  const out = [];
  wb.SheetNames.forEach(sn => {
    const data = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval: null });
    data.forEach(raw => {
      const d = {}; Object.keys(raw).forEach(k => { d[String(k).replace(/\s+/g, '').toUpperCase()] = raw[k]; });
      const q = num(d.CUMQTY); if (q <= 0) return;
      const alloc = String(d.ALLOCACCOUNT ?? '').trim();
      const acct = String(d.FIXACCOUNT ?? d.ACCOUNT ?? '').trim();
      const key = /^A\d+/i.test(alloc) ? alloc : acct;
      out.push({ src: 'LT', key, party: String(d.PARTYNAME ?? d.ACCOUNTNAME ?? key).trim(), sym: symKey(d.SYMBOL), bs: sideKey(d.SIDE), qty: q, val: q * num(d.AVGPX), tag: [d.CLIENTID, d.ONBEHALFOFCOMPID, key].filter(Boolean).join(' ') });
    });
  });
  return out;
}

function parseHT(XLSX, wb) {
  const out = [];
  wb.SheetNames.forEach(sn => {
    const data = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval: null });
    data.forEach(d => {
      const v = num(d['Cum Value']), q = num(d['Cum Qty']); if (v <= 0 || q <= 0) return;
      const key = String(d.Account ?? '').split('-')[0].trim();
      out.push({ src: 'HT', key, party: String(d['Party Name'] ?? key).trim(), sym: symKey(d.Symbol), bs: sideKey(d.Side), qty: q, val: v, tag: [d.Instruction, /^A\d+/i.test(key) ? 'OTA' : '', key].filter(Boolean).join(' ') });
    });
  });
  return out;
}

function parseXP(XLSX, wb) {
  const out = [];
  const ws = wb.Sheets[wb.SheetNames[0]]; const r = rowsOf(XLSX, ws); if (!r.length) return out;
  const hdr = r[0].map(h => String(h ?? '').replace(/\s+/g, ''));
  const ix = n => hdr.indexOf(n);
  const iAc = ix('帳號'), iCode = ix('代碼'), iBS = ix('B/S'), iDone = ix('已成交'), iRep = ix('回報成交'), iPx = ix('回報均價');
  for (let i = 1; i < r.length; i++) {
    const row = r[i]; if (!row) continue;
    const lots = Math.max(num(row[iDone]), num(row[iRep])); if (lots <= 0) continue;
    const q = Math.round(lots * 1000); const key = String(row[iAc] ?? '').trim();
    out.push({ src: 'XP', key, party: null, sym: symKey(row[iCode]), bs: sideKey(row[iBS]), qty: q, val: q * num(row[iPx]), tag: key });
  }
  return out;
}

// subset-sum: indices of items (qty array) summing exactly to target; earlier items preferred
function subsetSum(qtys, target, cap = 300000) {
  const reach = new Map(); reach.set(0, null);
  for (let i = 0; i < qtys.length; i++) {
    const add = [];
    for (const [s] of reach) { const t = s + qtys[i]; if (t <= target && !reach.has(t)) add.push([t, [s, i]]); }
    for (const [t, p] of add) reach.set(t, p);
    if (reach.has(target)) break;
    if (reach.size > cap) return null;
  }
  if (!reach.has(target) || target === 0) return null;
  const idx = []; let s = target;
  while (s !== 0) { const [prev, i] = reach.get(s); idx.push(i); s = prev; }
  return idx;
}

function runMatch(conf, orders, savedMap) {
  savedMap = savedMap || {};
  const rows = conf.map(r => ({ ...r, rem: r.sh, allocs: [] }));
  const confAcs = new Set(rows.map(r => r.ac));
  const acName = {}; rows.forEach(r => { acName[r.ac] = r.name; });
  // pool entries keyed by key|sym|bs
  const pool = new Map();
  orders.forEach(o => {
    const party = o.party || acName[o.key] || o.key;
    const k = o.key + '|' + o.sym + '|' + o.bs;
    if (!pool.has(k)) pool.set(k, { key: o.key, party, sym: o.sym, bs: o.bs, src: {}, tags: {}, rem: 0, total: 0 });
    const e = pool.get(k); if (o.tag) { (e.tags[o.src] = e.tags[o.src] || new Set()).add(o.tag); } e.src[o.src] = (e.src[o.src] || 0) + o.qty; e.rem += o.qty; e.total += o.qty;
  });
  const assoc = {}; // ac -> Set(party) found today
  const addAssoc = (ac, p) => { (assoc[ac] = assoc[ac] || new Set()).add(p); };

  function consume(row, e, q, how) {
    if (q <= 0) return;
    const parts = []; let left = q; const srcs = Object.keys(e.src).filter(s => e.src[s] > 0);
    srcs.forEach((s, i) => {
      const take = i === srcs.length - 1 ? left : Math.min(left, Math.round(q * e.src[s] / e.rem));
      if (take > 0) { parts.push([s, take]); left -= take; }
    });
    parts.forEach(([s, t]) => { e.src[s] -= t; row.allocs.push({ party: e.party, src: s, qty: t, how, tags: e.tags[s] ? [...e.tags[s]].join(' | ') : '' }); });
    e.rem -= q; row.rem -= q; addAssoc(row.ac, e.party);
  }

  // A. direct account match
  rows.forEach(r => {
    const e = pool.get(r.ac + '|' + r.sym + '|' + r.bs);
    if (e && e.rem > 0) consume(r, e, Math.min(r.rem, e.rem), 'direct');
  });
  // party-level entries for non-direct keys
  const partyEntries = [...pool.values()].filter(e => !confAcs.has(e.key) && e.rem > 0);
  const groups = {};
  partyEntries.forEach(e => { (groups[e.sym + '|' + e.bs] = groups[e.sym + '|' + e.bs] || []).push(e); });
  const saved = ac => savedMap[ac];

  // A2. name match: account name contains the client's name (e.g. "Banque Pictet" -> Pictet)
  const norm = t => ' ' + String(t || '').toLowerCase().replace(/[^a-z0-9&]+/g, ' ').trim() + ' ';
  Object.entries(groups).forEach(([g, ents]) => {
    ents.slice().sort((a, b) => norm(b.party).length - norm(a.party).length).forEach(e => {
      const ph = norm(e.party); if (ph.trim().length < 3 || e.rem <= 0) return;
      rows.filter(r => r.sym + '|' + r.bs === g && r.rem > 0 && norm(r.name).includes(ph))
        .sort((a, b) => b.rem - a.rem)
        .forEach(r => { if (e.rem > 0) consume(r, e, Math.min(r.rem, e.rem), 'name'); });
    });
  });
  // A3. distinctive first word of the client name (e.g. "M&G INVT" -> "M&G (Lux) ...", "Russell Investment" -> "Russell Investments ...")
  const STOP = new Set(['capital','group','american','global','first','the','national','asset','assets','investment','investments','fund','funds','bank','state','united','international','new','all','jp','sec','securities','china','asia','delta','emerging','market','markets','equity']);
  Object.entries(groups).forEach(([g, ents]) => {
    ents.forEach(e => {
      if (e.rem <= 0) return;
      const w = norm(e.party).trim().split(' ')[0];
      if (!w || w.length < 3 || STOP.has(w)) return;
      rows.filter(r => r.sym + '|' + r.bs === g && r.rem > 0 && norm(r.name).includes(' ' + w + ' '))
        .sort((a, b) => b.rem - a.rem)
        .forEach(r => { if (e.rem > 0) consume(r, e, Math.min(r.rem, e.rem), 'name'); });
    });
  });
  // B. exact subset per party
  Object.entries(groups).forEach(([g, ents]) => {
    ents.sort((a, b) => b.rem - a.rem);
    ents.forEach(e => {
      const cand = rows.filter(r => r.sym + '|' + r.bs === g && r.rem > 0);
      const toks = norm(e.party).trim().split(' ').filter(t => t.length >= 3);
      const score = r => (saved(r.ac) === e.party ? 100 : 0) + ((assoc[r.ac] && assoc[r.ac].has(e.party)) ? 50 : 0) + toks.filter(t => norm(r.name).includes(' ' + t + ' ')).length;
      cand.sort((a, b) => score(b) - score(a));
      const pick = subsetSum(cand.map(r => r.rem), e.rem);
      if (pick) pick.forEach(i => consume(cand[i], e, cand[i].rem, 'exact'));
    });
  });
  // C. affinity: rows whose account is linked to the party (today or saved)
  Object.entries(groups).forEach(([g, ents]) => {
    ents.forEach(e => {
      if (e.rem <= 0) return;
      rows.filter(r => r.sym + '|' + r.bs === g && r.rem > 0 && ((assoc[r.ac] && assoc[r.ac].has(e.party)) || saved(r.ac) === e.party))
        .forEach(r => { if (e.rem > 0) consume(r, e, Math.min(r.rem, e.rem), 'affinity'); });
    });
  });
  // D. direct account traded more than its own order file shows (e.g. a second basket): the client is certain, keep the same client & channel
  rows.forEach(r => {
    if (r.rem <= 0) return;
    const d = r.allocs.filter(a => a.how === 'direct');
    if (!d.length) return;
    const main = d.slice().sort((a, b) => b.qty - a.qty)[0];
    r.allocs.push({ party: main.party, src: main.src, qty: r.rem, how: 'direct+', tags: main.tags || '' });
    r.rem = 0;
  });
  const leftovers = [...pool.values()].filter(e => e.rem > 0);
  return { rows, assoc, leftovers };
}

// manual: { rowId: { party, src } }
function finalize(rows, manual, alias) {
  manual = manual || {}; alias = alias || {};
  const nm = p => alias[p] || p;
  rows.forEach(r => {
    r.isBad = Math.abs(r.bps - BAD_BPS) < 0.05;
    const m = manual[r.id];
    r.parts = r.allocs.map(a => ({ ...a }));
    if (r.rem > 0) r.parts.push({ party: m && m.party ? m.party : null, src: m && m.src ? m.src : null, qty: r.rem, how: 'manual', tags: '' });
    let fixed = 0, pending = false;
    r.parts.forEach(p => {
      p.gross = r.gross * p.qty / r.sh;
      p.client = p.party ? nm(p.party) : null;
      if (r.isBad) {
        if (p.src && RATE[p.src]) p.comm = Math.round(p.gross * RATE[p.src]);
        else if (p.src) p.comm = r.comm * p.qty / r.sh;
        else { p.comm = r.comm * p.qty / r.sh; pending = true; }
      } else p.comm = r.comm * p.qty / r.sh;
      fixed += p.comm;
    });
    r.commFixed = r.isBad ? Math.round(fixed) : r.comm;
    r.pending = pending;
    r.unresolved = r.parts.some(p => !p.party || (r.isBad && !p.src));
  });
  const clients = {};
  rows.forEach(r => r.parts.forEach(p => {
    const c = p.client || '（未指定）';
    const o = clients[c] = clients[c] || { client: c, gross: 0, comm: 0, src: {} };
    o.gross += p.gross; o.comm += p.comm; if (p.src) o.src[p.src] = (o.src[p.src] || 0) + p.gross;
  }));
  return Object.values(clients).sort((a, b) => b.gross - a.gross);
}

if (typeof module !== 'undefined' && module.exports) module.exports = { parseConf, parseLT, parseHT, parseXP, runMatch, finalize, RATE, BAD_BPS };

// ===== gzip 壓縮 / 解壓縮 =====
const gzOK=typeof CompressionStream==='function'&&typeof DecompressionStream==='function';
async function gzBlob(text){ if(!gzOK) return {blob:new Blob([text],{type:'application/json'}),gz:false};
  const stream=new Blob([text]).stream().pipeThrough(new CompressionStream('gzip')); return {blob:new Blob([await new Response(stream).arrayBuffer()],{type:'application/gzip'}),gz:true}; }
async function readMaybeGz(file){

  set(k,v){ store.mem[k]=v;
    if(k!=='days'&&k!=='settingsAt'&&!/^(mkt|brk|mkfetch):/.test(k)){ const at=new Date().toISOString(); store.mem.settingsAt=at; try{localStorage.setItem('perfrpt:settingsAt',JSON.stringify(at));}catch(_){} if(typeof scheduleSettings==='function') scheduleSettings(); }

function kvPut(k,v){ try{ const tx=IDB.db.transaction('meta','readwrite'); tx.objectStore('meta').put(v,'kv:'+k); tx.onerror=()=>{store.lastErr=tx.error;}; }catch(e){ store.lastErr=e; } }

function totals(){
  const r=state.rows;
  const gross=r.reduce((a,x)=>a+x.gross,0), c0=r.reduce((a,x)=>a+x.comm,0), c1=r.reduce((a,x)=>a+x.commFixed,0);
  let lt=0; r.forEach(x=>x.parts.forEach(p=>{if(p.src==='LT')lt+=p.gross}));
  const todo=r.filter(x=>x.unresolved).length;
  let eg=0,ec=0,el=0; (state.extra||[]).forEach(x=>{ if(!(x.gross>0))return; eg+=x.gross; ec+=(x.comm||0); if(x.dc==='D')el+=x.gross; });
  return {gross:gross+eg,c0:c0+ec,c1:c1+ec,lt:lt+el,todo,extraGross:eg};
}

  tab.innerHTML='待人工確認'+(t.todo?`<span class="n">${t.todo}</span>`:'');
}

}

function candidatesFor(r){
  // 1) parties linked to this account (today / saved)  2) leftover orders in same stock & side, closest qty first
  const c=[]; const linked=new Set(state.assoc[r.ac]?[...state.assoc[r.ac]]:[]); if(savedParty(r.ac))linked.add(savedParty(r.ac));
  const left=state.leftovers.filter(e=>e.sym===r.sym&&e.bs===r.bs&&e.rem>0);
  linked.forEach(p=>{
    const hit=left.filter(e=>e.party===p);
    if(hit.length) hit.forEach(e=>Object.keys(e.src).filter(s=>e.src[s]>0).forEach(s=>c.push({party:p,src:s,label:`${p} · ${SRC_LABEL[s]} 剩 ${fmtN(e.src[s])} 股`})));
    else c.push({party:p,src:null,label:`${p}（同帳號${savedParty(r.ac)===p?'・對照表':'今日其他成交'}）`});
  });
  left.filter(e=>!linked.has(e.party)).sort((a,b)=>Math.abs(a.rem-r.rem)-Math.abs(b.rem-r.rem)).forEach(e=>{
    Object.keys(e.src).filter(s=>e.src[s]>0).forEach(s=>c.push({party:e.party,src:s,label:`${e.party} · ${SRC_LABEL[s]} 剩 ${fmtN(e.src[s])} 股`}));
  });
  return c;
}
function allParties(){
  const s=new Set(state.parties||[]); (state.orders||[]).forEach(o=>{if(o.party)s.add(o.party)}); Object.keys(savedMap).forEach(k=>s.add(savedParty(k)));
  return [...s].sort((a,b)=>a.localeCompare(b));
}

   return `<tr class="uitem ${done?'done-row':''}" data-id="${r.id}"><td>${r.ac}</td><td>${esc(r.name.slice(0,22))}</td><td>${esc(r.code)}</td><td>${r.bs}</td><td class="r">${fmtN(r.sh)}</td><td class="r"><b>${fmtN(r.rem)}</b></td><td class="r">${fmtN(r.gross*r.rem/r.sh)}</td><td class="r ${r.isBad?'bad':''}">${r.bps}</td>

   <td><input type="text" list="partyList" class="mp" style="width:150px" value="${esc(m.party||'')}" placeholder="輸入或選擇"></td>
   <td><select class="ms"><option value="">${r.isBad?'必選':'—'}</option>${['LT','HT','XP','NU'].map(s=>`<option value="${s}" ${m.src===s?'selected':''}>${SRC_LABEL[s]}</option>`).join('')}</select></td>
   <td><input type="checkbox" class="mr" ${m.party&&savedParty(r.ac)===m.party?'checked':''} aria-label="記住此帳號"></td></tr>`}).join('')}
  </tbody></table></div>`;
  $('#p-todo').querySelectorAll('tr.uitem').forEach(tr=>{
    const id=+tr.dataset.id; const r=state.rows[id]; const cands=candidatesFor(r);
    const apply=()=>{
      const party=tr.querySelector('.mp').value.trim(); const src=tr.querySelector('.ms').value||null;
      manual[id]={party:party||null,src};
      const rem=tr.querySelector('.mr').checked;
      if(rem&&party){savedMap[r.ac]={party,src}; state.rows.forEach(r2=>{ if(r2.ac===r.ac&&r2.rem>0&&r2.id!==id){ const m2=manual[r2.id]; if(!m2||!m2.party) manual[r2.id]={party,src}; else if(!m2.src&&src) m2.src=src; } });} else if(!rem&&savedParty(r.ac)===party){delete savedMap[r.ac];}
      store.set('acmap',savedMap); recompute(); showTab('todo');
    };
    tr.querySelectorAll('.cand').forEach(b=>b.addEventListener('click',()=>{const c=cands[+b.dataset.i];tr.querySelector('.mp').value=c.party;if(c.src)tr.querySelector('.ms').value=c.src;apply();}));
    tr.querySelector('.mp').addEventListener('change',apply);
    tr.querySelector('.ms').addEventListener('change',apply);
    tr.querySelector('.mr').addEventListener('change',apply);
  });
}

const SUB=['fix','detail','rebate','month','map','db']; let lastSub='fix';
function showTab(p){
  if(p==='peta') p=lastSub;
  const sub=SUB.includes(p); if(sub) lastSub=p;
  document.querySelectorAll('#tabs .tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.p===p||(sub&&t.dataset.p==='peta')));
  document.querySelectorAll('#subtabs .tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.p===p));
  $('#subtabs').hidden=!sub; document.querySelector('.tab.peta').setAttribute('aria-expanded',sub);
  document.querySelector('.tab.peta').textContent=sub?'peta ▴':'peta ▾';
  document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id==='p-'+p||x.id==='p-'+p+'-wrap'));
}
$('#tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return; if(t.dataset.p==='peta'&&!$('#subtabs').hidden){showTab('report');return;} showTab(t.dataset.p);});

function xlDateKey(v){
  if(v==null||v==='') return null;
  if(typeof v==='number'){ const p=XLSX.SSF.parse_date_code(v); if(!p) return null; return `${p.y}/${String(p.m).padStart(2,'0')}/${String(p.d).padStart(2,'0')}`; }
  if(v instanceof Date) return `${v.getFullYear()}/${String(v.getMonth()+1).padStart(2,'0')}/${String(v.getDate()).padStart(2,'0')}`;
  const m=String(v).match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/); if(m) return `${m[1]}/${m[2].padStart(2,'0')}/${m[3].padStart(2,'0')}`;
  const m2=String(v).match(/^(\d{4})(\d{2})(\d{2})$/); return m2?`${m2[1]}/${m2[2]}/${m2[3]}`:null;
}
function parseMarketBook(wb){
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
    const hi=rows.findIndex(r=>r&&r.some(c=>String(c||'').trim()==='集買')&&r.some(c=>String(c||'').includes('集中總金額')));
    if(hi<0) continue;
    const h=rows[hi].map(c=>String(c||'').trim()); const ix=n=>h.findIndex(c=>c===n||c.includes(n));
    const c={d:ix('Date')>=0?ix('Date'):0,tb:ix('集買'),ts:ix('集賣'),ob:ix('櫃買'),os:ix('櫃賣'),ta:ix('集中總金額'),oa:ix('櫃台總金額')};
    if(Object.values(c).some(v=>v<0)) continue;
    const out={};
    rows.slice(hi+1).forEach(r=>{ if(!r) return; const d=xlDateKey(r[c.d]); if(!d) return;
      const n=k=>{const v=Number(String(r[c[k]]??'').replace(/,/g,'')); return isFinite(v)?v:null;};
      const tb=n('tb'),ts=n('ts'),ob=n('ob'),os=n('os'),ta=n('ta'),oa=n('oa');
      if([tb,ts,ob,os,ta,oa].some(v=>v===null)) return;
      out[d]={mkt:ta+oa,fb:tb+ob,fs:ts+os};
    });
    return out;
  }
  throw new Error('找不到市場資料：需要有「集買、集賣、櫃買、櫃賣、集中總金額、櫃台總金額」這幾欄的工作表。');
}

function normDate(v){ const t=String(v||'').trim(); if(!t) return '';
  let m=t.match(/^(\d{4})(\d{2})(\d{2})$/); if(m) return `${m[1]}/${m[2]}/${m[3]}`;
  m=t.match(/^(\d{2,4})\D+(\d{1,2})\D+(\d{1,2})$/); if(m){ let y=+m[1]; if(y<1000) y+=1911; return `${y}/${m[2].padStart(2,'0')}/${m[3].padStart(2,'0')}`; }
  return t; }

function parseOverview(wb,year){

    prefixName[histName(r[1])]=prefixName[histName(r[1])]||String(r[1]).trim(); });
  // 月工作表沒有資料的月份（例如當月），用底稿整理：Q 欄有值 = DMA
  const dm={}; detail.forEach(d=>{ if(months[d[0]]) return; const k=d[0]+'|'+histName(d[1])+'|'+(d[13]===0?1:0);
    const o=dm[k]=dm[k]||{m:d[0],client:histName(d[1]),turn:0,comm:0,net:0,rebate:0,research:0,dma:d[13]===0}; o.turn+=d[4]; o.comm+=d[6]; o.net+=d[7]; o.research+=d[9]; });
  Object.values(dm).forEach(o=>{ (months[o.m]=months[o.m]||[]).push({client:o.client,turn:o.turn,comm:o.comm,net:o.net,rebate:o.rebate,research:o.research,dma:o.dma}); });
  return {year,months,detail,prefixName};
}

function applyHistBase(){
  if(!hist) return null;
  const c=hist.cutoff, cm=Number(c.slice(5,7));
  const sum=(pred)=>{ let t=0,cm2=0,d=0; Object.entries(hist.months).forEach(([m,rows])=>{ if(!pred(Number(m))) return; rows.forEach(r=>{ t+=r.turn; cm2+=r.comm; if(r.dma) d+=r.turn; }); }); return {turn:t,comm:cm2,dma:d}; };
  const Y=sum(m=>m<=cm), M=sum(m=>m===cm);
  const mk=Object.keys(mktHist||{}).filter(x=>x<=c);
  const yd=mk.filter(x=>x.slice(0,4)===c.slice(0,4)).sort(), md=yd.filter(x=>x.slice(0,7)===c.slice(0,7));
  if(!yd.includes(c)) yd.push(c); if(!md.includes(c)&&c.slice(0,7)===c.slice(0,7)) md.push(c);
  const daysOK=yd.length>1&&yd.slice().sort()[0].slice(5)<='01/07';
  base.date=c;
  base.ytd=Object.assign({},base.ytd||{},{turn:Y.turn,comm:Y.comm,dma:Y.dma,exch:null,rebate:null});
  base.mtd=Object.assign({},base.mtd||{},{turn:M.turn,comm:M.comm,dma:M.dma,exch:null,rebate:null});
  if(daysOK){ base.ytdDays=yd.length; base.mtdDays=md.length; }
  store.set('base',base);
  return {daysOK,ytdDays:yd.length,mtdDays:md.length};
}

    if(state) recompute();

// ---- 期間排名 ----
function weekStart(d){ const [y,m,dd]=d.split('/').map(Number); const t=new Date(y,m-1,dd); const wd=(t.getDay()+6)%7; t.setDate(t.getDate()-wd); return `${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')}`; }
function periodClients(scope){
  const d=state.date, agg={};
  const add=(name,gross,src)=>{ if(!name||name==='（未指定）'||!gross) return; const n=canon(name); const o=agg[n]=agg[n]||{client:n,gross:0,src:{}}; o.gross+=gross; Object.entries(src||{}).forEach(([s,v])=>o.src[s]=(o.src[s]||0)+v); };
  const inScope=x=> scope==='day'?x===d : scope==='week'?(x>=weekStart(d)&&x<=d) : scope==='month'?(x.slice(0,7)===d.slice(0,7)&&x<=d) : (x.slice(0,4)===d.slice(0,4)&&x<=d);
  const useHist=hist&&(scope==='month'||scope==='year')&&hist.year===Number(d.slice(0,4));
  if(useHist){ const cm=Number(d.slice(5,7));
    Object.entries(hist.months).forEach(([m,rows])=>{ m=Number(m); if(scope==='month'?m!==cm:m>cm) return;
      rows.forEach(r=>add(r.client,r.turn,{[r.dma?'LT':'HT']:r.turn})); }); }
  const days=db();
  const after=x=>!useHist||x>hist.cutoff;
  Object.keys(days).filter(x=>x!==d&&inScope(x)&&after(x)).forEach(x=>(days[x].clients||[]).forEach(c=>add(c.client,c.gross,c.src)));
  if(after(d)||scope==='day'||scope==='week') state.clients.forEach(c=>add(c.client,c.gross,c.src));
  return Object.values(agg).sort((a,b)=>b.gross-a.gross);
}
function rankShow(){ const m=todayInput(); const [y,mo,dd]=state.date.split('/').map(Number); const t=new Date(y,mo-1,dd);

  return {w:m.showW!=null?m.showW:(fri||eom), y:m.showY!=null?m.showY:(fri||eom)}; }
function rankTable4(list,label,title){

  <tr class="total"><td></td><td>Total</td><td class="r">${f2(tot/1e8)}</td><td></td></tr></tbody></table></div>`;
}

async function exportOverview(){
  const say=m=>{$('#msg').className='msg';$('#msg').innerHTML=m;};
  const year=hist?hist.year:Number((state&&state.date||'').slice(0,4))||new Date().getFullYear();
  const cutoff=hist&&hist.year===year?hist.cutoff:'';
  // 1. 工具每天的資料（截止日之後）→ 依 月／客戶／DMA 與 月／客戶／帳號 彙總
  const snaps=(await IDB.all().catch(()=>[])).filter(s=>s.date.slice(0,4)===String(year)&&(!cutoff||s.date>cutoff)).sort((a,b)=>a.date<b.date?-1:1);
  const mAgg={}, dAgg={};
  for(const s of snaps){
    const rows=s.rows.map(r=>({...r,allocs:r.allocs||[]})); finalize(rows,s.manual||{},alias);
    const m=Number(s.date.slice(5,7));
    const addM=(client,dma,turn,comm)=>{ const k=m+'|'+client+'|'+(dma?1:0); const o=mAgg[k]=mAgg[k]||{m,client,dma,turn:0,comm:0}; o.turn+=turn; o.comm+=comm; };
    const addD=(client,ac,dma,turn,comm)=>{ const k=m+'|'+client+'|'+ac+'|'+(dma?1:0); const o=dAgg[k]=dAgg[k]||{m,client,ac,dma,turn:0,comm:0}; o.turn+=turn; o.comm+=comm; };
    rows.forEach(r=>r.parts.forEach(p=>{ const c=canon(p.client||'（未指定）'); const dma=p.src==='LT'; addM(c,dma,p.gross,p.comm); addD(c,r.ac,dma,p.gross,p.comm); }));
    (s.extra||[]).forEach(x=>{ if(!(x.gross>0)||!x.client) return; const c=canon(x.client); addM(c,x.dc==='D',x.gross,x.comm||0); addD(c,'',x.dc==='D',x.gross,x.comm||0); });
  }
  // 2. 每月資料 = 總覽（截止日前）+ 工具（截止日後）
  const monthRows=m=>{ const map={};

    if(hist&&hist.year===year&&hist.months[m]) hist.months[m].forEach(r=>put(r.client,r.dma,r));
    Object.values(mAgg).filter(o=>o.m===m).forEach(o=>put(o.client,o.dma,{turn:o.turn,comm:o.comm,net:o.comm}));

    const aoa=[['Client','Turnover',' Total Turnover','comm','Net comm','Rebate',' Research','DMA']]; const T=[0,0,0,0,0];
    names.forEach(n=>{ const rs=by[n].sort((a,b)=>(b.dma?1:0)-(a.dma?1:0)); const tot=rs.reduce((a,r)=>a+r.turn,0);

        T[0]+=r.turn;T[1]+=r.comm;T[2]+=r.net;T[3]+=r.rebate||0;T[4]+=r.research||0; }); });

  const wb=XLSX.utils.book_new(); const all=[];

  const det=[['Date','Client','A / C #','Trader','Transacted','rate','comm','Net comm ','Special Charge',' Research',' ',null,null,null,null,null,'DMA']];
  if(hist&&hist.year===year) hist.detail.forEach(d=>det.push([d[0],d[1],d[2],d[3],d[4],d[5],d[6],d[7],d[8],d[9]||null,d[10],d[11],d[12],null,null,null,d[13]]));

    det.push([o.m,nm,acFmt(o.ac),null,Math.round(o.turn),o.turn?o.comm/o.turn:0,Math.round(o.comm),Math.round(o.comm),null,null,null,null,nm,null,null,null,o.dma?0:null]); });

  XLSX.utils.book_append_sheet(wb,wsd,'底稿');

  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});

function cumulate(scope){ // scope 'mtd' | 'ytd'
  const d=state.date, ym=d.slice(0,7), y=d.slice(0,4);
  const inScope=x=>scope==='mtd'?x.slice(0,7)===ym:x.slice(0,4)===y;
  const sum={}; FIELDS.forEach(([k])=>sum[k]=0); let days=1, missing=new Set();
  const bd=normDate(base.date);
  if(bd&&bd===d){ // 期初累計就截至今天（例如業績總覽截至今天）：直接用期初，不再加今天
    const b=base[scope]||{}; FIELDS.forEach(([k])=>{const v=pn(b[k]); if(v===null)missing.add(k); else sum[k]=v;}); days=Number(base[scope+'Days'])||1;
    const hs0=histSum(scope,d); if(hs0){ ['mkt','fb','fs'].forEach(k=>{sum[k]=hs0[k]; missing.delete(k);}); }
    return {sum,days,missing,valid:true,hist:!!hs0};
  }
  const useBase=bd&&bd<d&&inScope(bd);
  if(useBase){ const b=base[scope]||{}; FIELDS.forEach(([k])=>{const v=pn(b[k]); if(v===null)missing.add(k); else sum[k]+=v;}); days+=Number(base[scope+'Days'])||0; }
  const saved=db();
  Object.keys(saved).filter(x=>x<d&&inScope(x)&&(!useBase||x>bd)).forEach(x=>{
    const r=saved[x].rpt; days++;
    FIELDS.forEach(([k])=>{const v=r?r[k]:null; if(v===null||v===undefined)missing.add(k); else sum[k]+=v;});
  });
  const tv=todayVals(); FIELDS.forEach(([k])=>{if(tv[k]===null||tv[k]===undefined)missing.add(k); else sum[k]+=tv[k];});
  // 沒有期初累計時，只有在資料從月初／年初開始存起才算完整
  let valid=useBase;
  if(!valid){
    const earliest=[...Object.keys(saved).filter(x=>x<d&&inScope(x)),d].sort()[0];
    const [ey,em,ed]=earliest.split('/').map(Number);
    valid=scope==='mtd'?ed<=5:(em===1&&ed<=7);
  }
  if(!valid) FIELDS.forEach(([k])=>missing.add(k));
  const hs=histSum(scope,d); if(hs){ ['mkt','fb','fs'].forEach(k=>{sum[k]=hs[k]; missing.delete(k);}); }
  return {sum,days,missing,valid,hist:!!hs};
}
function kpis(v,days,missing){
  const has=(...ks)=>ks.every(k=>!missing.has(k)&&v[k]!==null&&v[k]!==undefined);
  const turnE=v.turn/1e8;
  return {
    share:{t:targets.share, a:has('turn','mkt')&&v.mkt?v.turn/(2*v.mkt)*1e4:null},
    fini:{t:targets.fini, a:has('turn','fb','fs')&&(v.fb+v.fs)?v.turn/(v.fb+v.fs)*1e4:null},
    per:{t:targets.turnD?targets.commD/targets.turnD:null, a:has('turn','comm')&&turnE?v.comm/turnE:null},
    turn:{t:targets.turnD*days, a:has('turn')?turnE:null},
    comm:{t:targets.commD*days, a:has('comm')?v.comm:null},
    exch:has('exch')?v.exch:null, rebate:has('rebate')?v.rebate:null,
    net:has('comm','exch','rebate')?v.comm-v.exch-v.rebate:null,
    days, fini_b:has('fb')?v.fb:null, fini_s:has('fs')?v.fs:null, mkt:has('mkt')?v.mkt:null, dma:has('dma')?v.dma:null, turnRaw:has('turn')?v.turn:null
  };
}
function reportCalc(){
  const tv=todayVals(); const none=new Set(FIELDS.map(([k])=>k).filter(k=>tv[k]===null||tv[k]===undefined));
  const day=kpis(tv,1,none);
  const m=cumulate('mtd'), y=cumulate('ytd');
  return {day, mtd:{...kpis(m.sum,m.days,m.missing),valid:m.valid}, ytd:{...kpis(y.sum,y.days,y.missing),valid:y.valid}};
}

function ruleMatches(R,r,p){
  if(!R.on) return false;
  const acs=list(R.acs), ex=list(R.excl), cl=list(R.clients).map(x=>x.toLowerCase()), tg=list(R.tags).map(x=>x.toLowerCase());
  if(!acs.length&&!cl.length&&!tg.length&&!ex.length) return false;
  if(ex.includes(r.ac)) return true;
  if(!acs.length&&!cl.length&&!tg.length) return false;
  if(acs.length&&!acs.includes(r.ac)) return false;
  if(cl.length){const hay=[p.party,p.client,r.name].filter(Boolean).join(' | ').toLowerCase(); if(!cl.some(c=>hay.includes(c))) return false;}
  if(tg.length){const hay=(p.tags||'').toLowerCase(); if(!tg.some(t=>hay.includes(t))) return false;}
  if(R.ch&&R.ch!=='any'&&p.src!==R.ch) return false;
  return true;
}
function tierOK(t,cbps,src){
  if(t.ch&&t.ch!=='any'&&src!==t.ch) return false;
  const v=Number(t.bps)||0, tol=0.05;
  switch(t.cond){case 'lt':return cbps<v-tol;case 'le':return cbps<=v+tol;case 'eq':return Math.abs(cbps-v)<=tol;case 'ge':return cbps>=v-tol;case 'gt':return cbps>v+tol;default:return true;}
}
function calcRebate(){
  const lines=[]; const byRule={};
  rules.forEach(R=>byRule[R.id]={R,n:0,gross:0,comm:0,rebate:0,noTier:0,own:0,ownGross:0});
  state.rows.forEach(r=>r.parts.forEach(p=>{
    const R=rules.find(R=>ruleMatches(R,r,p)); if(!R) return;
    const G=p.gross, C=p.comm, cbps=G?C/G*1e4:0;
    let rebate=0, tier=null, ded=0; const own=list(R.excl).includes(r.ac);
    if(own){}
    else if(R.type==='rule'){
      ded=(R.exch?G*exchRate/1e4:0)+G*(Number(R.csa)||0)/1e4+G*(Number(R.research)||0)/1e4;
      tier=R.tiers.find(t=>tierOK(t,cbps,p.src));
      if(tier){const net=Math.max(0,C-ded);
        rebate=tier.act==='split'?net*(1-(Number(tier.val)||0)):Math.max(0,net-G*(Number(tier.val)||0)/1e4);}
    }
    const b=byRule[R.id]; b.n++; b.gross+=G; b.comm+=C; b.rebate+=rebate; if(own){b.own++;b.ownGross+=G;} else if(R.type==='rule'&&!tier)b.noTier++;
    lines.push({r,p,R,cbps,ded,tier,rebate,own});
  }));
  const manual=(todayInput().rebateManual)||{};
  let manualSum=0; rules.filter(R=>R.on&&R.type==='manual').forEach(R=>{const v=Number(manual[R.id])||0; byRule[R.id].rebate+=v; manualSum+=v;});
  const auto=lines.reduce((a,l)=>a+l.rebate,0);
  return {lines,byRule,total:auto+manualSum,auto,manualSum};
}

  $('#p-rebate').querySelectorAll('.rule').forEach(card=>{
    const R=rules[+card.dataset.i];
    const bind=(cls,fn,ev='change')=>{const el=card.querySelector(cls); if(el) el.addEventListener(ev,()=>{fn(el); refresh();});};
    bind('.f-on',el=>R.on=el.checked); bind('.f-name',el=>R.name=el.value.trim()||'未命名'); bind('.f-note',el=>R.note=el.value);
    bind('.f-acs',el=>R.acs=el.value); bind('.f-excl',el=>R.excl=el.value); bind('.f-clients',el=>R.clients=el.value); bind('.f-tags',el=>R.tags=el.value);
    bind('.f-ch',el=>R.ch=el.value); bind('.f-type',el=>{R.type=el.value; if(R.type==='rule'&&!R.tiers.length)R.tiers.push(T('any',0,'any','keep',0));});
    bind('.f-exch',el=>R.exch=el.checked); bind('.f-csa',el=>R.csa=pn(el.value)||0); bind('.f-research',el=>R.research=pn(el.value)||0);
    card.querySelector('.up').addEventListener('click',()=>{const i=+card.dataset.i;[rules[i-1],rules[i]]=[rules[i],rules[i-1]];refresh();});
    card.querySelector('.dn').addEventListener('click',()=>{const i=+card.dataset.i;[rules[i+1],rules[i]]=[rules[i],rules[i+1]];refresh();});
    card.querySelector('.del').addEventListener('click',()=>{if(confirm(`刪除「${R.name}」？`)){rules.splice(+card.dataset.i,1);refresh();}});
    const ta=card.querySelector('.t-add'); if(ta) ta.addEventListener('click',()=>{R.tiers.push(T('any',0,'any','keep',0));refresh();});
    card.querySelectorAll('.tiers tbody tr').forEach(tr=>{
      const t=R.tiers[+tr.dataset.j];
      const tb=(cls,fn)=>{const el=tr.querySelector(cls); el.addEventListener('change',()=>{fn(el);refresh();});};
      tb('.t-cond',el=>t.cond=el.value); tb('.t-bps',el=>t.bps=pn(el.value)||0); tb('.t-ch',el=>t.ch=el.value);
      tb('.t-act',el=>{t.act=el.value; if(t.act==='split'&&t.val>1)t.val=0.5;}); tb('.t-val',el=>t.val=pn(el.value)||0);
      tr.querySelector('.t-del').addEventListener('click',()=>{R.tiers.splice(+tr.dataset.j,1);refresh();});
    });
  });
}

const IDB={db:null,ok:false,
  open(){return new Promise(res=>{try{const rq=indexedDB.open('perfrpt',2);
    rq.onupgradeneeded=()=>{const d=rq.result; if(!d.objectStoreNames.contains('snap'))d.createObjectStore('snap',{keyPath:'date'}); if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');};
    rq.onsuccess=()=>{IDB.db=rq.result;IDB.ok=true; IDB.db.onversionchange=()=>{try{IDB.db.close();}catch(_){}}; res(true);}; rq.onerror=()=>res(false);
    rq.onblocked=()=>{ /* 其他分頁還開著舊版：等它們關閉，不當作失敗 */ setTimeout(()=>{ if(!IDB.ok){ const m=document.getElementById('msg'); if(m){m.className='msg err'; m.textContent='請關閉其他已開啟的 Fubon Daily Report 分頁，再重新整理這一頁。';} } },3000); };
  }catch(e){res(false);}});},
  tx(mode){return IDB.db.transaction('snap',mode).objectStore('snap');},
  req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  mem:new Map(),
  put(v){ IDB.mem.set(v.date,v); return IDB.ok?IDB.req(IDB.tx('readwrite').put(v)):Promise.resolve(); },
  get(k){ return IDB.ok?IDB.req(IDB.tx('readonly').get(k)):Promise.resolve(IDB.mem.get(k)||null); },
  del(k){ IDB.mem.delete(k); return IDB.ok?IDB.req(IDB.tx('readwrite').delete(k)):Promise.resolve(); },
  all(){ return IDB.ok?IDB.req(IDB.tx('readonly').getAll()):Promise.resolve([...IDB.mem.values()]); },
  keys(){ return IDB.ok?IDB.req(IDB.tx('readonly').getAllKeys()):Promise.resolve([...IDB.mem.keys()]); }
};

function collectSettings(){
  const kv={}; Object.assign(kv,store.mem);
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k.startsWith('perfrpt:')){const kk=k.slice(8); if(!(kk in store.mem)) kv[kk]=JSON.parse(localStorage.getItem(k));}}}catch(e){}
  Object.keys(kv).forEach(k=>{ if(k==='days'||k==='_t'||PER_DATE.test(k)) delete kv[k]; });
  return kv;
}
async function pushSettings(){
  if(!SYNC.ok) return;
  try{ await fsWrite(SYNC.dir,'settings.json',JSON.stringify({savedAt:new Date().toISOString(),kv:collectSettings()})); }

async function pushDay(d,snap){
  if(!SYNC.ok) return {ok:false};
  try{
    const dd=await daysDir();
    if(!snap){ snap=await IDB.get(d); if(!snap) return {ok:false}; }
    let conflict=false;
    const prevTxt=await fsRead(dd,dayFile(d));
    if(prevTxt){ try{const prev=JSON.parse(prevTxt); if(SYNC.lastSeen[d]&&prev.savedAt>SYNC.lastSeen[d]&&prev.savedAt!==snap.savedAt){ conflict=true;
      await fsWrite(dd,dayFile(d).replace('.json',`.覆蓋前備份_${Date.now()}.json`),prevTxt);} }catch(_){}}
    const kv={}; ['mkt:','brk:'].forEach(p=>{const v=store.get(p+d,null); if(v!=null) kv[p+d]=v;});
    await fsWrite(dd,dayFile(d),JSON.stringify({date:d,savedAt:snap.savedAt,summary:db()[d]||null,kv,snap}));
    SYNC.lastSeen[d]=snap.savedAt;
    return {ok:true,conflict};
  }catch(e){ syncFail(e); return {ok:false}; }
}

function syncFail(e){
  const nm=e&&e.name||''; let why;
  if(nm==='NotAllowedError'||nm==='SecurityError') why='沒有共用資料夾的權限，請按「授權共用資料夾」，或確認你對公槽有寫入權限。';
  else if(nm==='NotFoundError') why='找不到共用資料夾，可能是公槽沒有連線（例如 VPN 斷線）或資料夾被移動。';
  else why=`寫入共用資料夾失敗（${esc(nm)}：${esc(e&&e.message||'')}）。`;

}

async function pullAll(){
  let n=0;
  const st=await fsRead(SYNC.dir,'settings.json');
  if(st){ try{const j=JSON.parse(st); const cur=collectSettings(); Object.entries(j.kv||{}).forEach(([k,v])=>{ if(JSON.stringify(cur[k])!==JSON.stringify(v)){ store.set(k,v); n++; } });}catch(_){} }
  const dd=await daysDir(); const days=db();
  for await (const [name,h] of dd.entries()){
    if(h.kind!=='file'||!/^\d{4}-\d{2}-\d{2}\.json$/.test(name)) continue;
    try{
      const j=JSON.parse(await (await h.getFile()).text()); const d=j.date;
      const local=await IDB.get(d);
      if(!local||j.savedAt>local.savedAt){ await IDB.put(j.snap); if(j.summary) days[d]=j.summary; Object.entries(j.kv||{}).forEach(([k,v])=>store.set(k,v)); if(!snapKeys.includes(d))snapKeys.push(d); n++; }
      SYNC.lastSeen[d]=j.savedAt>(local&&local.savedAt||'')?j.savedAt:(local&&local.savedAt);
    }catch(_){}
  }
  store.set('days',days);
  return n;
}
async function pushAll(){
  const remote=new Set(); const dd=await daysDir();
  for await (const [name,h] of dd.entries()) if(h.kind==='file') remote.add(name);
  let n=0; for(const d of snapKeys){ if(!remote.has(dayFile(d))){ await pushDay(d); n++; } }
  if(!(await fsRead(SYNC.dir,'settings.json'))) await pushSettings();
  return n;
}
async function syncNow(reloadIfChanged=true){
  if(SYNC.busy) return; SYNC.busy=true; syncStat('<span class="msg">同步中…</span>');
  try{
    const n=await pullAll(); const up=await pushAll();
    if(n&&reloadIfChanged){ await applyPulled(); renderSyncBtn(); $('#syncStat').insertAdjacentHTML('beforeend',` <span class="okc">已從共用資料夾讀入 ${n} 項</span>`); return; }
    renderSyncBtn(); $('#syncStat').insertAdjacentHTML('beforeend',` <span class="msg">已是最新${up?`，上傳 ${up} 天`:''}</span>`);
  }catch(e){ syncFail(e); } finally{ SYNC.busy=false; }
}
async function applyPulled(){

function parseBrokerTxt(buf){
  let text; try{text=new TextDecoder('big5').decode(buf);}catch(e){text=new TextDecoder().decode(buf);}
  const dm=text.match(/(\d{2,3})\/(\d{1,2})\/(\d{1,2})/); if(!dm) throw new Error('讀不到成交日，請確認是「指定券商群業績表」的 txt。');
  const date=`${+dm[1]+1911}/${dm[2].padStart(2,'0')}/${dm[3].padStart(2,'0')}`;
  const rows={};
  text.split(/\r?\n/).forEach(l=>{const m=l.trim().match(/^([0-9A-Z]{4})\s+([\d,.\-]+)\s+([\d,.\-]+)\s+([\d,.\-]+)$/); if(m) rows[m[1]]=[m[2],m[3],m[4]].map(v=>Number(v.replace(/,/g,'')));});
  if(!Object.keys(rows).length) throw new Error('檔案裡沒有讀到券商資料。');
  return {date,rows};
}
function brokerRows(){
  const raw=store.get(brkKey(state.date),null); if(!raw) return null;
  const R=reportCalc();
  const selfV=[R.day.turnRaw,R.mtd.turnRaw,R.ytd.turnRaw].map(v=>v==null?null:v/1e6); // 元→百萬
  const known=new Set(brkMap.map(b=>b.code));
  const list=brkMap.map(b=>({...b,v:b.code==='SELF'?selfV:(raw.rows[b.code]||[null,null,null]).map(x=>x==null?null:x*100),missing:b.code!=='SELF'&&!raw.rows[b.code]}));
  Object.keys(raw.rows).filter(c=>!known.has(c)).forEach(c=>list.push({code:c,name:c,rank:false,v:raw.rows[c].map(x=>x*100),unknown:true}));
  const den=k=>({fini:[R.day,R.mtd,R.ytd].map(x=>x.fini_b!=null&&x.fini_s!=null?(x.fini_b+x.fini_s)/1e6:null),mkt:[R.day,R.mtd,R.ytd].map(x=>x.mkt!=null?x.mkt*2/1e6:null)}[k]);
  const fd=den('fini'), md=den('mkt');
  const ranked=list.filter(b=>b.rank).sort((a,b)=>(b.v[0]||0)-(a.v[0]||0));
  const others=list.filter(b=>!b.rank);
  return {raw,ranked,others,fd,md};
}
function renderBroker(){
  const box=$('#brokerCard'); if(!box||!state) return;
  const B=brokerRows();
  const raw0=store.get(brkKey(state.date),null);
  $('#brkMsg').innerHTML=raw0?`目前日期 ${state.date} 已有券商資料（${esc(raw0.file||'')}）。重新上傳會覆蓋。`:`<span class="pending">${state.date} 還沒有券商資料</span>，上傳後會出現在報表最下方。`;
  if(!B){ box.innerHTML=''; renderBrkMap(); return; }
  const pct=(v,d)=>v==null||!d?'—':(v/d*100).toFixed(2)+'%';
  const num=v=>v==null?'—':(v===0?'-':Math.round(v).toLocaleString('en-US'));
  const cells=b=>[0,1,2].map(i=>`<td class="r c${i}">${num(b.v[i])}</td><td class="r c${i}">${b.v[i]==null?'—':pct(b.v[i],B.fd[i])}</td><td class="r c${i}">${b.v[i]==null?'—':pct(b.v[i],B.md[i])}</td>`).join('');
  const nameCell=b=>`${esc(b.name)}${b.unknown?' <span class="pending">未設定名稱</span>':''}${b.missing?' <span class="pending">txt 沒有</span>':''}`;
  box.innerHTML=`<div class="rp-head brk-head"><h2>券商排名</h2><span>單位：新台幣百萬元</span></div>
  <div class="scroll"><table class="brk"><thead><tr><th></th><th></th><th class="r c0">${state.date}</th><th class="r c0">FINI</th><th class="r c0">Market</th><th class="r c1">MTD</th><th class="r c1">FINI</th><th class="r c1">Market</th><th class="r c2">YTD(mn)</th><th class="r c2">FINI</th><th class="r c2">Market</th></tr></thead><tbody>
  ${B.ranked.map((b,i)=>`<tr class="${b.code==='SELF'?'self':''}"><td class="r">${i+1}</td><td>${nameCell(b)}</td>${cells(b)}</tr>`).join('')}
  ${B.others.map((b,i)=>`<tr class="${i===0?'sep':''}"><td></td><td>${nameCell(b)}</td>${cells(b)}</tr>`).join('')}
  </tbody></table></div>
  <p class="foot">FINI = 券商成交值 ÷（FINI 買進 + 賣出）；Market = 券商成交值 ÷（市場成交值 × 2）。Fubon 取本工具的成交值；其他券商取「指定券商群業績表」。*若有鉅額交易，待隔日才會加入鉅額交易之數字統計，故當日會有誤差。(Numbers exclude crosses, will reflect a day late.)</p>`;
  renderBrkMap();
}
function renderBrkMap(){
  const el=$('#brkMapBox'); if(!el) return;
  el.innerHTML=`<details><summary>券商代號設定</summary><p class="note">「排名」勾選的會依當日成交值排序；沒勾的固定列在下方（例如本土券商）。代號 SELF 代表本公司，數字取本工具的成交值。txt 裡有、這裡沒設定的代號會出現在下方並標示「未設定名稱」。</p>
   <div class="scroll"><table><thead><tr><th>代號</th><th>顯示名稱</th><th>排名</th><th></th></tr></thead><tbody>
   ${brkMap.map((b,i)=>`<tr data-i="${i}"><td><input type="text" class="bc" value="${esc(b.code)}" style="width:80px"></td><td><input type="text" class="bn" value="${esc(b.name)}"></td><td><input type="checkbox" class="br" ${b.rank?'checked':''}></td><td><button class="bu" ${i?'':'disabled'}>↑</button> <button class="bdn" ${i<brkMap.length-1?'':'disabled'}>↓</button> <button class="bx">刪除</button></td></tr>`).join('')}
   </tbody></table></div><div class="toolbar" style="margin-top:8px"><button id="brkAdd">新增券商</button><button id="brkReset">還原預設</button></div></details>`;
  const save=()=>{store.set('brkMap',brkMap); const op=el.querySelector('details').open; renderBroker(); el.querySelector('details').open=op; persist();};
  el.querySelectorAll('tbody tr').forEach(tr=>{const b=brkMap[+tr.dataset.i];
    tr.querySelector('.bc').addEventListener('change',e=>{b.code=e.target.value.trim().toUpperCase();save();});
    tr.querySelector('.bn').addEventListener('change',e=>{b.name=e.target.value.trim()||b.code;save();});
    tr.querySelector('.br').addEventListener('change',e=>{b.rank=e.target.checked;save();});
    tr.querySelector('.bu').addEventListener('click',()=>{const i=+tr.dataset.i;[brkMap[i-1],brkMap[i]]=[brkMap[i],brkMap[i-1]];save();});
    tr.querySelector('.bdn').addEventListener('click',()=>{const i=+tr.dataset.i;[brkMap[i+1],brkMap[i]]=[brkMap[i],brkMap[i+1]];save();});
    tr.querySelector('.bx').addEventListener('click',()=>{brkMap.splice(+tr.dataset.i,1);save();});
  });
  $('#brkAdd').addEventListener('click',()=>{brkMap.push({code:'',name:'新券商',rank:true});save();el.querySelector('details').open=true;});
  $('#brkReset').addEventListener('click',()=>{if(confirm('還原成預設的券商設定？')){brkMap=JSON.parse(JSON.stringify(BRK_DEFAULT));save();}});
}
$('#brkFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return; e.target.value='';
  try{
    const r=parseBrokerTxt(await f.arrayBuffer());
    store.set(brkKey(r.date),{date:r.date,rows:r.rows,file:f.name,at:new Date().toISOString()});
    if(state&&r.date!==state.date){
      $('#brkMsg').innerHTML=`<span class="pending">這份 txt 是 ${r.date} 的，已存到那一天；目前畫面是 ${state.date}。</span>`;
    } else { renderBroker(); $('#brkMsg').textContent=`已讀入 ${r.date}，共 ${Object.keys(r.rows).length} 家券商，已加到報表最下方。`; persist(); }
  }catch(err){ $('#brkMsg').innerHTML=`<span class="pending">${esc(err.message)}</span>`; }
});
function brokerSheet(){
  const B=brokerRows(); if(!B) return null;
  const p=(v,d)=>v==null||!d?null:v/d;
  const rows=[['#','券商',state.date+'(mn)','FINI','Market','MTD(mn)','FINI','Market','YTD(mn)','FINI','Market']];
  [...B.ranked.map((b,i)=>[i+1,b]),...B.others.map(b=>['',b])].forEach(([n,b])=>rows.push([n,b.name,...[0,1,2].flatMap(i=>[b.v[i]==null?null:Math.round(b.v[i]),p(b.v[i],B.fd[i]),p(b.v[i],B.md[i])])]));
  return XLSX.utils.aoa_to_sheet(rows);
}

// ===== 匯出給同事 / 匯入同事的檔案（合併，以較新的為準）=====
async function exportShare(){
  const snaps=await IDB.all().catch(()=>[]);
  const days=db();
  const out={tool:'業績日報',kind:'share',version:1,exported:new Date().toISOString(),
    settingsAt:store.get('settingsAt',''),settings:collectSettings(),
    days:snaps.map(sn=>{const d=sn.date; const kv={}; ['mkt:','brk:'].forEach(p=>{const v=store.get(p+d,null); if(v!=null)kv[p+d]=v;}); return {date:d,savedAt:sn.savedAt,summary:days[d]||null,kv,snap:sn};})};
  const t=new Date(); const p2=n=>String(n).padStart(2,'0');
  const z=await gzBlob(JSON.stringify(out));
  const name=`FubonDailyReport_${t.getFullYear()}${p2(t.getMonth()+1)}${p2(t.getDate())}_${p2(t.getHours())}${p2(t.getMinutes())}.json${z.gz?'.gz':''}`;
  await saveFile(name,z.blob,$('#msg'));
  const kb=z.blob.size/1024; const sz=kb>1024?(kb/1024).toFixed(1)+' MB':Math.max(1,Math.round(kb))+' KB';
  $('#msg').className='msg'; $('#msg').textContent=`已匯出 ${out.days.length} 天的資料和所有設定（${name}，${sz}）。`;
}
async function importShare(file){
  const say=(m,err)=>{$('#msg').className=err?'msg err':'msg'; $('#msg').innerHTML=m;};
  let j; try{ j=JSON.parse(await readMaybeGz(file)); }catch(e){ say('匯入失敗：'+(e.message&&e.message.includes('瀏覽器')?e.message:'檔案不是正確的格式。'),1); return; }
  if(j.tool!=='業績日報'){ say('匯入失敗：這不是 Fubon Daily Report 匯出的檔案。',1); return; }
  if(j.kind!=='share'){ // 舊的完整備份也接受：轉成同樣的格式
    if(!j.kv){ say('匯入失敗：檔案內容不完整。',1); return; }
    j={settingsAt:'',settings:Object.fromEntries(Object.entries(j.kv).filter(([k])=>k!=='days'&&!/^(mkt|brk|mkfetch):/.test(k))),
      days:(j.snaps||[]).map(sn=>({date:sn.date,savedAt:sn.savedAt,summary:(j.kv.days||{})[sn.date]||null,kv:Object.fromEntries(Object.entries(j.kv).filter(([k])=>k.endsWith(':'+sn.date))),snap:sn}))};
  }
  let added=0,updated=0,kept=0; const days=db();
  for(const d of (j.days||[])){
    const local=await IDB.get(d.date);
    if(!local||d.savedAt>local.savedAt){
      await IDB.put(d.snap); if(d.summary) days[d.date]=d.summary;
      Object.entries(d.kv||{}).forEach(([k,v])=>store.set(k,v));
      if(!snapKeys.includes(d.date)) snapKeys.push(d.date);
      local?updated++:added++;
    } else kept++;
  }
  store.set('days',days);
  let setMsg='';
  const localAt=store.get('settingsAt','');
  if(j.settings&&(!localAt||(j.settingsAt&&j.settingsAt>localAt))){
    Object.entries(j.settings).forEach(([k,v])=>{ if(k!=='settingsAt') store.set(k,v); });
    store.mem.settingsAt=j.settingsAt||new Date().toISOString(); try{localStorage.setItem('perfrpt:settingsAt',JSON.stringify(store.mem.settingsAt));}catch(_){}
    setMsg='設定（規則、目標、期初累計、對照表）已更新為檔案中的版本。';
  } else setMsg='設定沒有變動（你這邊已是相同或較新的版本）。';
  await applyPulled();
  say(`<span class="okc">✓ 匯入完成</span>：新增 ${added} 天、更新 ${updated} 天${kept?`、${kept} 天你這邊已是最新`:''}。${setMsg}`);
}
$('#ovExport').addEventListener('click',()=>exportOverview().catch(e=>{$('#msg').className='msg err';$('#msg').textContent='匯出失敗：'+e.message;}));
$('#shareExport').addEventListener('click',()=>exportShare().catch(e=>{$('#msg').className='msg err';$('#msg').textContent='匯出失敗：'+e.message;}));
$('#shareImport').addEventListener('change',e=>{const f=e.target.files[0]; e.target.value=''; if(f) importShare(f);});
